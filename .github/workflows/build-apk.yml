name: Build Vibely Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Vibely.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-APK
          path: android/app/build/outputs/apk/debug/Vibely.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Vibely Android App (APK)"
          body: |
            ## 📱 Vibely Android Mobile App (.apk)
            
            Direct installable Android APK for Vibely with real-time calling and background alerts!
            
            ### How to install on your phone:
            1. Download `Vibely.apk` below directly on your mobile browser.
            2. Open the file and tap "Install".
            3. Grant Microphone, Camera, and Notification permissions when prompted.
            4. Real-time calls and messages will now alert your phone even when the app is in the background!
          files: android/app/build/outputs/apk/debug/Vibely.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
