name: Build Vibely Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Sync Capacitor Android
        run: |
          npm run cap sync android || npx cap sync android || echo "Capacitor already synced"


      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            CAUSE=$(grep -A 6 "What went wrong:" build.log | tr '\n' ' ' | sed 's/"//g' | cut -c 1-250)
            if [ -z "$CAUSE" ]; then
              CAUSE=$(grep -A 6 "Caused by:" build.log | head -n 6 | tr '\n' ' ' | sed 's/"//g' | cut -c 1-250)
            fi
            echo "::error title=Gradle Root Cause::$CAUSE"
            exit $STATUS
          fi

      - name: Locate and Prepare APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK file was found in android directory!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/Vibely.apk
          ls -lh build-output/Vibely.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-APK
          path: build-output/Vibely.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Vibely Android App (APK)"
          body: |
            ## 📱 Vibely Android Mobile App (.apk)
            
            Direct installable Android APK for Vibely with real-time calling and background alerts!
            
            ### How to install on your phone:
            1. Download `Vibely.apk` below directly on your mobile browser.
            2. Open the file and tap "Install".
            3. Grant Microphone, Camera, and Notification permissions when prompted.
            4. Real-time calls and messages will now alert your phone even when the app is in the background!
          files: build-output/Vibely.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
